# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

# Linux x64.
#
# shadPS4 needs clang 19 and a C++23 standard library; the buildbot's Linux image
# (Ubuntu 18.04) cannot build it, so the job runs in Ubuntu 24.04 with clang 19 from
# apt.llvm.org, as the project's own GitHub CI does, and GCC 14's libstdc++, which that
# CI's runners have and the sources count on (a bare image has GCC 13's, where a header
# the sources use without including it is not pulled in). The core then needs glibc 2.39.
#
# Windows x64: cross-built on Linux, see the job. Not here: Linux aarch64, macOS and
# Android - the emulator runs the game's x86-64 code directly on the
# host CPU and has no other backend.
#
# Both build with the static Makefile, which leaves the core in the project's
# directory under the name the templates keep as the job's artifact. Only the
# templates' names and artifacts are used: the image and the steps are the jobs' own.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "0"

.core-defs:
  variables:
    CORENAME: parallel_ps4

include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

stages:
  - build-prepare
  - build-shared

# A runner having a bad minute should not redden the pipeline; anything really
# broken still fails three times over.
default:
  retry: 2

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Defining before_script replaces the template's instead of adding to it, so
# its NUMPROC is set again here.
.core-defs-linux:
  extends: .core-defs
  image: ubuntu:24.04
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
      ca-certificates wget gnupg git make pkg-config build-essential binutils
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    - echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" > /etc/apt/sources.list.d/llvm-19.list
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
      clang-19 libstdc++-14-dev
      libudev-dev libdbus-1-dev uuid-dev
      python3 nasm zlib1g-dev
  script:
    - make -j $NUMPROC CC=clang-19 CXX=clang++-19
    - strip --strip-unneeded ${CORENAME}_libretro.so

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs-linux

# Windows 64-bit
#
# The sources need a current MinGW-w64, newer than the buildbot's, so the job
# cross-builds on Linux: clang and lld against the C runtime, Windows headers
# and libstdc++ of MSYS2's UCRT64 environment (.ci/build-windows-cross.sh), the
# build `make` gives in an MSYS2 shell on Windows. The template's MXE image and
# steps are not used, only its name and artifacts.
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  image: ubuntu:24.04
  timeout: 3h
  variables:
    # The script's sysroot inside the project, so that GitLab's cache can keep
    # it between pipelines (Craig). The script fetches it again when MSYS2's
    # packages have moved on.
    SHAD_CROSS_TOOLS: $CI_PROJECT_DIR/.cross-tools
  cache:
    key:
      files:
        - .ci/build-windows-cross.sh
      prefix: windows-x64
    paths:
      - .cross-tools/ucrt64/
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - NUMPROC=$NUMPROC .ci/build-windows-cross.sh
