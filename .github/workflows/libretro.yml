name: Build libretro core

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build, comma separated (linux, windows, arm64; box64core for the aarch64 core through box64)"
        default: "linux,windows,arm64"

concurrency:
  group: libretro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    if: contains(inputs.platforms, 'linux') || contains(inputs.platforms, 'box64core')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y clang-19 build-essential libudev-dev uuid-dev

    - name: Cache the compiler's output
      uses: hendrikmuhs/ccache-action@v1.2.21
      with:
        append-timestamp: false
        key: libretro-linux-${{ hashFiles('Makefile', 'Makefile.common') }}

    - name: Build
      run: make -j$(nproc) CC="ccache clang-19" CXX="ccache clang++-19"

    - name: Collect
      run: |
        mkdir out
        cp parallel_ps4_libretro.so out/
        cp libretro/parallel_ps4_libretro.info out/
        ls -la out
        nm -D --defined-only out/parallel_ps4_libretro.so | grep -c ' retro_'
        # What the aarch64 core carries: this build and its launcher, which it starts
        # through box64, without their debugging information
        mkdir parts
        cp out/parallel_ps4_libretro.so parts/
        cp obj/unix-x86_64/gen/parallel_ps4_libretro_host parts/
        strip --strip-unneeded parts/parallel_ps4_libretro.so parts/parallel_ps4_libretro_host
        readelf -d parts/parallel_ps4_libretro.so | grep NEEDED
        ls -la parts

    - uses: actions/upload-artifact@v7
      with:
        name: parallel_ps4_libretro-linux-x86_64
        path: out/

    - uses: actions/upload-artifact@v7
      if: contains(inputs.platforms, 'box64core')
      with:
        name: x86_64-parts
        path: parts/

  # The earlier aarch64 core, carrying box64 and the x86-64 build of the emulator, which it
  # runs through box64; built only when asked for (box64core)
  linux-arm64:
    name: Linux aarch64 (box64)
    if: contains(inputs.platforms, 'box64core')
    needs: [linux, box64]
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/download-artifact@v8
      with:
        name: x86_64-parts
        path: parts

    - uses: actions/download-artifact@v8
      with:
        name: box64-linux-aarch64
        path: parts

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y clang-19 build-essential libudev-dev uuid-dev

    - name: Cache the compiler's output
      uses: hendrikmuhs/ccache-action@v1.2.21
      with:
        append-timestamp: false
        key: libretro-linux-arm64-${{ hashFiles('Makefile', 'Makefile.common') }}

    - name: Build
      run: make -j$(nproc) CC="ccache clang-19" CXX="ccache clang++-19" LIBRETRO_X86_64_PARTS=${{github.workspace}}/parts

    - name: Collect
      run: |
        mkdir out
        cp parallel_ps4_libretro.so out/
        cp libretro/parallel_ps4_libretro.info out/
        strip --strip-unneeded out/parallel_ps4_libretro.so
        ls -la out
        nm -D --defined-only out/parallel_ps4_libretro.so | grep -c ' retro_'

    - uses: actions/upload-artifact@v7
      with:
        name: parallel_ps4_libretro-linux-aarch64-box64
        path: out/

  # The aarch64 core with the game's code run through FEXCore in its own process, in
  # place of box64 (ENABLE_FEX_GUEST_CPU): FEX built and its smoke test run, then the core.
  linux-arm64-fex:
    name: Linux aarch64
    if: contains(inputs.platforms, 'arm64')
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add LLVM repository
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main'

    - name: Install dependencies
      run: sudo apt-get update && sudo apt install -y clang-19 lld-19 build-essential libudev-dev uuid-dev

    - name: Cache the compiler's output
      uses: hendrikmuhs/ccache-action@v1.2.21
      with:
        append-timestamp: false
        key: libretro-linux-arm64-fex-${{ hashFiles('Makefile', 'Makefile.common') }}

    # FEX is built from externals/fex by the core's own Makefile
    - name: FEXCore smoke test
      run: make -j$(nproc) CC="ccache clang-19" CXX="ccache clang++-19" ENABLE_FEX_GUEST_CPU=1 fexcore-smoke && ./fexcore-smoke

    # -k: every file that does not compile yet, not just the first
    - name: Build
      run: make -k -j$(nproc) CC="ccache clang-19" CXX="ccache clang++-19" ENABLE_FEX_GUEST_CPU=1

    - name: Collect
      run: |
        mkdir out
        cp parallel_ps4_libretro.so out/
        cp libretro/parallel_ps4_libretro.info out/
        # With its symbols, for backtraces of crashes on the test machine
        mkdir symbols && cp out/parallel_ps4_libretro.so symbols/
        strip --strip-unneeded out/parallel_ps4_libretro.so
        ls -la out
        # The frontend loads the core with dlopen: no static TLS
        ! readelf -dW out/parallel_ps4_libretro.so | grep -q STATIC_TLS

    - uses: actions/upload-artifact@v7
      with:
        name: parallel_ps4_libretro-linux-aarch64
        path: out/

    - uses: actions/upload-artifact@v7
      with:
        name: symbols-linux-aarch64
        path: symbols/

  # box64, which the aarch64 core starts the x86-64 emulator's process through.
  box64:
    name: box64 aarch64
    if: contains(inputs.platforms, 'box64')
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Fetch box64
      # main, not v0.4.4: the release lacks __cxa_at_quick_exit, which the
      # emulator calls while it starts
      run: |
        git init box64 && cd box64
        git remote add origin https://github.com/ptitSeb/box64.git
        git fetch --depth 1 origin 4437c9b8b1307409261500915ada9012aa04def8
        git checkout FETCH_HEAD

    # The emulator maps the whole PS4 address range, 4 MB to 85 TB, at fixed
    # addresses. box64 puts itself, the program it runs and its translated
    # code inside that range by default; they are moved above it.
    - name: Keep box64 out of the PS4 address range
      working-directory: box64
      run: |
        sed -i 's|#define HIGH   (void\*)0x60000000|#define HIGH   (void*)0x680000000000LL|' src/custommem.c
        sed -i 's|void\* mainaddr = (void\*)0x100000000LL;|void* mainaddr = (void*)0x600000000000LL;|' src/custommem.c
        sed -i 's|InternalMmap(box64_isAddressSpace32?NULL:(void\*)0x100000000ULL, size|InternalMmap(box64_isAddressSpace32?NULL:(void*)0x700000000000ULL, size|' src/custommem.c
        git diff --stat
        test "$(git diff | grep -c '^+[^+]')" = 3

    - uses: actions/checkout@v6
      with:
        path: core

    # Which faults are writes: box64 told that by decoding the x86 instruction
    # at RIP, which says "read" for a fault in a wrapped native function (a
    # memcpy) or in an opcode it does not decode. The emulator then leaves the
    # page protected and the same write faulted forever: Horizon Chase Turbo
    # stopped while loading. The patch takes ARM64's own exception syndrome.
    - name: Write faults from the exception syndrome
      working-directory: box64
      run: git apply --verbose ../core/.ci/box64-write-fault.patch

    - name: Build
      run: |
        cmake -S box64 -B box64/build -DARM_DYNAREC=ON -DNOLOADADDR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build box64/build --parallel $(nproc)

    - name: Collect
      run: |
        mkdir out
        cp box64/build/box64 out/
        strip --strip-unneeded out/box64
        ls -la out
        out/box64 --version

    - uses: actions/upload-artifact@v7
      with:
        name: box64-linux-aarch64
        path: out/

  # Cross-built on Linux, as the libretro buildbot's job (.gitlab-ci.yml): the build
  # `make` gives in an MSYS2 UCRT64 shell on Windows
  windows:
    name: Windows x86_64
    if: contains(inputs.platforms, 'windows')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build
      run: sudo SHAD_CROSS_TOOLS=${{github.workspace}}/.cross-tools .ci/build-windows-cross.sh

    - name: Collect
      run: |
        mkdir out
        cp parallel_ps4_libretro.dll out/
        cp libretro/parallel_ps4_libretro.info out/
        ls -la out

    - uses: actions/upload-artifact@v7
      with:
        name: parallel_ps4_libretro-windows-x86_64
        path: out/

  # The test build release: a build of all three platforms on the branch named by the
  # repository variable RELEASE_BRANCH replaces the release's files and moves its tag
  release:
    name: Update release
    if: github.ref_name == vars.RELEASE_BRANCH && contains(inputs.platforms, 'linux') && contains(inputs.platforms, 'windows') && contains(inputs.platforms, 'arm64')
    needs: [linux, linux-arm64-fex, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: libretro-test
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        pattern: parallel_ps4_libretro-*
        path: artifacts

    - name: Zip
      run: |
        for dir in artifacts/*/; do
          (cd "$dir" && zip -9 "../../$(basename "$dir").zip" *)
        done
        ls -la *.zip

    - name: Move the tag and replace the files
      run: |
        gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
        gh release upload "$TAG" --clobber *.zip

    - name: Name the build in the release notes
      run: |
        version=$(sed -n 's/^APP_VERSION *:= *//p' Makefile.common)
        short=${GITHUB_SHA::7}
        first="Test build of the shadPS4 (PlayStation 4) libretro core, shadPS4 $version. Built on $(date -u +%Y-%m-%d) from commit [$short](https://github.com/$GH_REPO/commit/$GITHUB_SHA) of branch \`$GITHUB_REF_NAME\`."
        gh release view "$TAG" --json body --jq .body > notes.md
        { echo "$first"; tail -n +2 notes.md; } > new-notes.md
        gh release edit "$TAG" --notes-file new-notes.md
