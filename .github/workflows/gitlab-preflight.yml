# Replays the libretro buildbot's Linux job (.gitlab-ci.yml) in the same image, since the
# buildbot's pipelines cannot be started from here. Keep the two in step: the commands
# below are the job's before_script and script, word for word.

name: GitLab CI preflight

on:
  workflow_dispatch:

jobs:
  linux-x64:
    name: libretro-build-linux-x64
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Replay the job in ubuntu:24.04
      run: |
        docker run --rm -v "$PWD":/src -w /src \
          -e DEBIAN_FRONTEND=noninteractive -e CORENAME=parallel_ps4 \
          ubuntu:24.04 bash -euxc '
            export NUMPROC=$(($(nproc)/5)); [ "$NUMPROC" -ge 1 ] || NUMPROC=$(nproc)
            git config --global --add safe.directory "*" || true
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              ca-certificates wget gnupg git make pkg-config build-essential binutils
            git config --global --add safe.directory "*"
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" > /etc/apt/sources.list.d/llvm-19.list
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              clang-19 libstdc++-14-dev \
              libudev-dev libdbus-1-dev uuid-dev \
              python3 nasm zlib1g-dev
            make -j $NUMPROC CC=clang-19 CXX=clang++-19
            strip --strip-unneeded ${CORENAME}_libretro.so
            ls -la ${CORENAME}_libretro.so
            nm -D --defined-only ${CORENAME}_libretro.so | grep " retro_"
          '

    - uses: actions/upload-artifact@v7
      with:
        name: parallel_ps4_libretro-buildbot-linux-x64
        path: parallel_ps4_libretro.so
